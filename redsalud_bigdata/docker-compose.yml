services:
  postgres:
    image: postgres:15
    container_name: redsalud_postgres
    environment:
      POSTGRES_USER: redsalud
      POSTGRES_PASSWORD: redsalud123
      POSTGRES_DB: redsalud_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d/01_init.sql
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: redsalud_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
